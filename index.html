<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo Bagués</title>
    <style>
        body { font-family: sans-serif; background-color: #fdf6f9; text-align: center; margin: 0; }
        header { background-color: #f4cfdf; padding: 20px; border-bottom: 3px solid #e1b1c6; }
        .galeria { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; }
        .producto { background: white; border: 1px solid #ddd; margin: 10px; padding: 15px; border-radius: 10px; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .producto img { width: 100%; height: 180px; object-fit: contain; border-radius: 5px; }
        h2 { font-size: 1.1rem; color: #5d4a66; }
        .boton { display: block; background: #25d366; color: white; padding: 8px; text-decoration: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>Mi Catálogo Bagués</h1>
</header>

<div class="galeria">

    <div class="producto">
        <img src="Aroma para Ropa.png">
        <h2>Aroma para Ropa</h2>
        <a href="https://wa.me/tu-numero" class="boton">Consultar</a>
    </div>

    <div class="producto">
        <img src="Aromatizantes Ambientales 500ml (1).png">
        <h2>Ambientales 500ml</h2>
        <a href="https://wa.me/tu-numero" class="boton">Consultar</a>
    </div>

    <div class="producto">
        <img src="Aromatizantes C_lidos (1).png">
        <h2>Aromatizantes Cálidos</h2>
        <a href="https://wa.me/tu-numero" class="boton">Consultar</a>
    </div>

    <div class="producto">
        <img src="Aromatizantes Florales - Sin precios.png">
        <h2>Florales</h2>
        <a href="https://wa.me/tu-numero" class="boton">Consultar</a>
    </div>

    <div class="producto">
        <img src="Aromatizantes Higos y Matcha.png">
        <h2>Higos y Matcha</h2>
        <a href="https://wa.me/tu-numero" class="boton">Consultar</a>
    </div>

</div>

</body>
</html>
