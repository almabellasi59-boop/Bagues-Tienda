<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Profesional - Bagués</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f9f9f9; color: #333; margin: 0; padding: 20px; text-align: center; }
        header { padding: 40px 0; border-bottom: 1px solid #eee; margin-bottom: 40px; }
        h1 { font-weight: 300; letter-spacing: 2px; text-transform: uppercase; margin: 0; }
        .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .producto { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .producto:hover { transform: translateY(-5px); }
        .producto img { max-width: 100%; height: auto; border-radius: 4px; }
        .btn-whatsapp { display: inline-block; margin-top: 40px; padding: 15px 30px; background-color: #25d366; color: white; text-decoration: none; border-radius: 50px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Catálogo de Belleza</h1>
        <p>Fragancias y Cosmética</p>
    </header>

    <div class="galeria">
        <div class="producto"><img src="foto1.jpg" alt="Producto"></div>
        <div class="producto"><img src="foto2.jpg" alt="Producto"></div>
        </div>

    <a href="https://wa.me/tu-numero-aqui" class="btn-whatsapp">Consultar por WhatsApp</a>

</body>
</html>
