<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Bagués</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #fdf6f9; }
        header { background-color: #f4cfdf; padding: 20px; text-align: center; border-bottom: 3px solid #e1b1c6; }
        .galeria { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .producto { background: white; border-radius: 10px; width: 220px; padding: 15px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .producto img { width: 100%; height: 220px; object-fit: cover; border-radius: 5px; }
        h2 { font-size: 1.1rem; color: #5d4a66; }
        .precio { color: #b8a782; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

<header>
    <h1>Bagués - Tienda Oficial 💎</h1>
    <p>Fragancias y Bienestar</p>
</header>

<div class="galeria">
    <div class="producto">
        <img src="Difusor y Aromatizante Lino.png" alt="Lino">
        <h2>Aromatizante Lino</h2>
        <p class="precio">$ Consultar</p>
    </div>

    <div class="producto">
        <img src="Aromatizantes Higos y Matcha.png" alt="Higos y Matcha">
        <h2>Higos y Matcha</h2>
        <p class="precio">$ Consultar</p>
    </div>

    <div class="producto">
        <img src="Aromatizantes Florales - Sin preci...jpg" alt="Florales">
        <h2>Aromatizante Florales</h2>
        <p class="precio">$ Consultar</p>
    </div>
</div>

</body>
</html>
