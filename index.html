<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Bagués</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f9f9f9; }
        header { background-color: #f4cfdf; padding: 20px; text-align: center; border-bottom: 3px solid #e1b1c6; }
        .galeria { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .producto { background: white; border: 1px solid #ddd; border-radius: 10px; width: 200px; padding: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .producto img { width: 100%; height: auto; border-radius: 5px; }
        h2 { font-size: 1rem; color: #5d4a66; }
        .precio { color: #b8a782; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>Bagués - Tienda Oficial 💎</h1>
    <p>Fragancias y Bienestar</p>
</header>

<div class="galeria">
    <div class="producto">
        <img src="https://via.placeholder.com/200" alt="Producto">
        <h2>Perfume Femenino</h2>
        <p class="precio">$ Consultar</p>
    </div>
    <div class="producto">
        <img src="https://via.placeholder.com/200" alt="Producto">
        <h2>Aromatizador Textil</h2>
        <p class="precio">$ Consultar</p>
    </div>
</div>

</body>
</html>
